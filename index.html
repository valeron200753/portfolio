<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tokyo | Portfolio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <h2>Tokyo.</h2>

            <div>
                <a href="#about">About</a>
                <a href="#skills">Skills</a>
                <a href="#projects">Projects</a>
                <a href="#contact">Contact</a>
            </div>
        </nav>
    </header>

    <main>

        <section id="hero">
            <h1 id="heroTitle">Hi, I'm Tokyo</h1>

            <p>Junior Full-Stack Developer</p>

            <button id="contactButton">
                Contact me
            </button>
        </section>

        <section id="about">
            <h2>About me</h2>

            <p>
                I'm learning full-stack development and building
                web applications with JavaScript, React and Node.js.
            </p>
        </section>

        <section id="skills">
            <h2>Skills</h2>

            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>Git</li>
                <li>Linux</li>
            </ul>
        </section>

        <section id="projects">
            <h2>Projects</h2>

            <div id="projectList"></div>
        </section>

        <section id="contact">
            <h2>Contact</h2>

            <form id="contactForm">
                <input
                    id="nameInput"
                    type="text"
                    placeholder="Your name"
                >

                <input
                    id="emailInput"
                    type="email"
                    placeholder="Your email"
                >

                <button type="submit">
                    Send
                </button>
            </form>

            <p id="formMessage"></p>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
